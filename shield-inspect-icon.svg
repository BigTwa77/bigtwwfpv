<svg width="480" height="480" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="shieldClip">
      <path d="M120 12 L212 46 L212 118 C212 170 172 206 120 228 C68 206 28 170 28 118 L28 46 Z" />
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="240" height="240" fill="#0E1011" />

  <!-- shield body -->
  <path
    d="M120 12 L212 46 L212 118 C212 170 172 206 120 228 C68 206 28 170 28 118 L28 46 Z"
    fill="#1D2022"
    stroke="#3A4045"
    stroke-width="5"
  />

  <!-- diagonal read/scan band, clipped to shield silhouette -->
  <g clip-path="url(#shieldClip)">
    <rect x="-20" y="150" width="300" height="16" fill="#FF6A13" transform="rotate(-28 120 158)" opacity="0.9" />
  </g>

  <!-- shoulder rivets -->
  <circle cx="62" cy="58" r="5" fill="#3A4045" />
  <circle cx="178" cy="58" r="5" fill="#3A4045" />

  <!-- AI lens / sensor motif -->
  <g stroke="#FF6A13" stroke-width="4" fill="none">
    <circle cx="120" cy="104" r="30" />
    <line x1="120" y1="64" x2="120" y2="78" />
    <line x1="120" y1="130" x2="120" y2="144" />
    <line x1="80" y1="104" x2="94" y2="104" />
    <line x1="146" y1="104" x2="160" y2="104" />
  </g>
  <circle cx="120" cy="104" r="7" fill="#FF6A13" />

  <!-- verified check badge -->
  <circle cx="120" cy="104" r="0" fill="none" />
  <g transform="translate(120,168)">
    <circle r="22" fill="#FF6A13" />
    <path d="M-10 0 L-3 8 L12 -10" stroke="#1A1C1D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
